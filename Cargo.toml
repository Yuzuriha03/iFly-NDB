[package]
name = "ifly_ndb_converter"
version = "2.1.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"
description = "Convert navdata from Fenix format to iFly supplemental format"
license = "GPL-3.0-only"
repository = "https://github.com/6639835/iFly-NDB"
keywords = ["navdata", "ifly", "converter", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
encoding_rs = "0.8"
geographiclib-rs = "0.2.7"
num-traits = "0.2"
rayon = "1"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[build-dependencies]
winresource = "0.1"
